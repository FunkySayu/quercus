services:
  backend:
    image: ghcr.io/funkysayu/quercus-backend:latest
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      - CSV_PATH=/data/trees.csv
    restart: unless-stopped

  web:
    image: ghcr.io/funkysayu/quercus-web:latest
    ports:
      - "49821:80"
    depends_on:
      - backend
    restart: unless-stopped
