server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression des réponses JSON, y compris proxifiées : les couronnes LiDAR
    # (/api/lidar/crowns, ~1 Mo) passent à ~200 Ko, utile en 4G sur le terrain.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json text/css application/javascript;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
